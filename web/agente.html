<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script>try{if(localStorage.getItem('tema')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squad Cost Copilot · Agente</title>
  <meta name="description" content="Descreva o time em texto livre e veja o custo em cada consultoria. A IA entende o pedido, o código faz a conta.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4FFF'/%3E%3Crect x='6' y='8' width='20' height='4' rx='2' fill='white'/%3E%3Crect x='6' y='14' width='14' height='4' rx='2' fill='white' opacity='.8'/%3E%3Crect x='6' y='20' width='9' height='4' rx='2' fill='white' opacity='.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="agente.css">
</head>
<body>
  <header class="topo sticky-top">
    <nav class="navbar" aria-label="Principal">
      <div class="wrap barra-topo-agente">
        <a class="marca" href="agente.html"><span class="logo"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><rect x="6" y="8" width="20" height="4" rx="2" fill="#fff"/><rect x="6" y="14" width="14" height="4" rx="2" fill="#fff" opacity=".8"/><rect x="6" y="20" width="9" height="4" rx="2" fill="#fff" opacity=".6"/></svg></span>Squad Cost Copilot</a>
        <div class="acoes-topo">
          <a class="link-discreto" href="index.html">Site completo</a>
          <button type="button" class="btn-tema" id="btn-tema" aria-label="Alternar tema claro e escuro">🌙</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="wrap agente">
    <section class="conversa" aria-labelledby="titulo">
      <h1 id="titulo">Descreva o time que você precisa</h1>
      <p class="lead">Escreva em linguagem comum. A IA entende o pedido e o código calcula o custo em cada consultoria.</p>

      <form class="entrada-agente" id="form" aria-label="Pedido de squad">
        <textarea id="msg" rows="3" placeholder="Ex.: 2 Backend N3 e 1 Full Stack N3 de janeiro a junho" aria-label="Seu pedido"></textarea>
        <button type="submit" class="btn btn-primary" id="enviar">Calcular</button>
      </form>

      <ul class="sugestoes" aria-label="Sugestões de pedido">
        <li><button type="button" class="link-sugestao" data-texto="2 Backend N3 e 1 Full Stack N3 de janeiro a junho">2 Backend N3 e 1 Full Stack N3</button></li>
        <li><button type="button" class="link-sugestao" data-texto="Squad de 5 pessoas de janeiro a dezembro">Squad de 5 pessoas</button></li>
        <li><button type="button" class="link-sugestao" data-texto="Modelo Z, super power squad, de janeiro a dezembro">Super power squad</button></li>
      </ul>

      <div class="resposta" id="resposta" aria-live="polite"></div>

      <p class="nota-agente" id="aviso-config" hidden>Chat não configurado. Veja a <a href="config.html">Configuração</a> para conectar o n8n.</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="conexao.js"></script>
  <script src="agente.js"></script>
  <script>(function(){var b=document.getElementById('btn-tema'),r=document.documentElement;function sync(){var d=r.getAttribute('data-theme')==='dark';b.textContent=d?'☀️':'🌙';b.setAttribute('aria-pressed',d)}sync();b.addEventListener('click',function(){var d=r.getAttribute('data-theme')!=='dark';if(d)r.setAttribute('data-theme','dark');else r.removeAttribute('data-theme');try{localStorage.setItem('tema',d?'dark':'light')}catch(e){}sync()})})();</script>
</body>
</html>
